<style>
/* Layout: one-column mobile app shell — sticky header with role switch, content, bottom tab bar. Paper-form detail view + A4 print sheet. */
:root{
  --bg:#eef1f0; --surface:#ffffff; --ink:#18242a; --muted:#5d6b70; --line:#d5dcdb;
  --accent:#0f5e6e; --accent-ink:#ffffff; --accent-soft:#dcecee;
  --a:#1f7a4a; --a-soft:#dff1e6; --b:#0f6f86; --b-soft:#dbeef3; --c:#b8650c; --c-soft:#fbebd6; --d:#b42a2a; --d-soft:#f8dddd;
  --pending:#5b4bb0; --pending-soft:#e7e3f7;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171a; --surface:#172227; --ink:#e3ecec; --muted:#97a7aa; --line:#2b3a3f;
  --accent:#4fb3c4; --accent-ink:#06191d; --accent-soft:#16343b;
  --a:#5fcf8f; --a-soft:#173326; --b:#5cc3da; --b-soft:#14333b; --c:#f0a54c; --c-soft:#3a2a14; --d:#f07a7a; --d-soft:#3c1c1c;
  --pending:#a99cf0; --pending-soft:#28234a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171a; --surface:#172227; --ink:#e3ecec; --muted:#97a7aa; --line:#2b3a3f;
  --accent:#4fb3c4; --accent-ink:#06191d; --accent-soft:#16343b;
  --a:#5fcf8f; --a-soft:#173326; --b:#5cc3da; --b-soft:#14333b; --c:#f0a54c; --c-soft:#3a2a14; --d:#f07a7a; --d-soft:#3c1c1c;
  --pending:#a99cf0; --pending-soft:#28234a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink)}
header.top .wrap{display:flex;flex-direction:column;gap:6px;padding-block:10px 12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-size:20px;margin:0;letter-spacing:.2px}
.proj{font-size:12.5px;opacity:.9}
.roles{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.roles button{border:0;background:transparent;color:inherit;font:inherit;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;cursor:pointer}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--accent)}
.hbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.langbtn{font:inherit;font-size:13px;font-weight:700;border:1.5px solid rgba(255,255,255,.6);background:transparent;color:inherit;border-radius:999px;padding:4px 12px;cursor:pointer;min-width:44px}
.langbtn:hover{background:rgba(255,255,255,.14)}
.who{font:inherit;font-size:13px;font-weight:600;border:0;background:rgba(255,255,255,.16);color:inherit;border-radius:999px;padding:5px 12px;cursor:pointer;max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who:hover{background:rgba(255,255,255,.26)}
.bell{position:relative;padding:5px 10px}
.bdg{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--d);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;padding:0 4px;text-align:center;font-family:var(--mono)}
.auth{max-width:420px;margin:24px auto 0}
.auth h2{margin-top:0}
.auth form{display:flex;flex-direction:column;gap:12px}
.demoacc{margin-top:14px;font-size:13px}
.demoacc table{width:100%;border-collapse:collapse}
.demoacc td,.demoacc th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:start}
.demoacc th{font-size:12px;color:var(--muted);font-weight:600}
.demoacc button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:2px 10px;cursor:pointer}
.linkbtn{font:inherit;background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
.err{color:var(--d);font-size:13px;font-weight:600}
.members{display:flex;flex-direction:column;gap:8px}
.mem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.mem .nm{font-weight:600}
.mem .em{font-size:12.5px;color:var(--muted);direction:ltr;unicode-bidi:plaintext;text-align:start;display:block}
.tagb{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);margin-inline-start:6px}
.tagb.off{background:var(--d-soft);color:var(--d)}
.mem .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:460px){#if{grid-template-columns:1fr!important}}
a.btn{text-decoration:none;display:inline-block}
@media (max-width:460px){.mem{grid-template-columns:auto 1fr}.mem .acts{grid-column:1/-1;justify-content:flex-start}}
.invcode{font-family:var(--mono);font-size:20px;letter-spacing:3px;background:var(--bg);border:1px dashed var(--accent);border-radius:10px;padding:8px 14px;display:inline-block;direction:ltr}
[dir=ltr] .no,[dir=ltr] [style*="text-align:right"]{text-align:left!important}
main{padding-block:16px 96px}
.demo{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.demo button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:3px 10px;cursor:pointer}
h2{font-family:var(--display);font-size:19px;margin:18px 0 10px;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:start;font:inherit;color:inherit}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:460px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:start;font:inherit;color:inherit;width:100%}
.row:focus-visible,.stat:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row .meta{min-width:0}
.no{font-family:var(--mono);font-size:12px;color:var(--muted);direction:ltr;text-align:right;display:block}
.subj{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.sub{font-size:12.5px;color:var(--muted)}
.type{font-family:var(--mono);font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 8px;min-width:46px;text-align:center}
.code{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.code .k{font-family:var(--display);font-size:14px}
.c-A{background:var(--a-soft);color:var(--a)} .c-B{background:var(--b-soft);color:var(--b)} .c-C{background:var(--c-soft);color:var(--c)} .c-D{background:var(--d-soft);color:var(--d)} .c-P{background:var(--pending-soft);color:var(--pending)}
.late{color:var(--d);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
nav.tabs{position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs .wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-block:8px}
nav.tabs button{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px;cursor:pointer}
nav.tabs button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.tabs button.sel{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
nav.tabs button{font-size:14px;padding:10px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
form .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){form .grid{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
.full{grid-column:1/-1}
.disc{display:flex;gap:6px;flex-wrap:wrap}
.disc label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:500;color:var(--ink);cursor:pointer}
.disc input{width:auto}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
/* paper form */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.paper .ph{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:2px solid var(--ink)}
.paper .ph .t{font-family:var(--display);font-size:18px}
.paper .ph .en{font-family:var(--mono);font-size:11.5px;color:var(--muted);direction:ltr}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.kv div{padding:8px 16px;border-inline-start:1px solid var(--line);min-width:0}
.kv div:first-child{border-inline-start:0}
.kv small{display:block;font-size:11.5px;color:var(--muted)}
.kv strong{font-weight:600;overflow-wrap:anywhere}
@media (max-width:460px){.kv{grid-template-columns:1fr 1fr}.kv div:nth-child(3){grid-column:1/-1;border-inline-start:0;border-top:1px solid var(--line)}}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec h3{font-size:13px;color:var(--muted);margin:0 0 6px;letter-spacing:.2px}
.revs{display:flex;gap:6px;flex-wrap:wrap}
.revs button{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.revs button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.shot{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg);cursor:default;max-width:100%}
.shot.annot{cursor:crosshair}
.shot img{display:block;width:100%}
.pin{position:absolute;transform:translate(50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--d);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--d);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
/* notes with photos */
.nlist{display:flex;flex-direction:column;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.nitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.nitem .txt{min-width:0}
.nitem .txt input{padding:6px 8px;font-size:14px;background:var(--surface)}
.nitem .tag{font-size:11.5px;color:var(--muted)}
.nphoto{position:relative;width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--muted);display:grid;place-items:center;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);overflow:hidden;background:var(--surface);cursor:pointer;padding:4px}
.nphoto.has{border-style:solid;border-color:var(--line);padding:0}
.nphoto img{width:100%;height:100%;object-fit:cover;display:block}
.nphoto input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.nphoto .ic{font-size:22px;line-height:1;display:block}
.nphoto button.view{all:unset;position:absolute;inset:0;cursor:zoom-in}
.pbtns{display:flex;gap:4px;margin-top:4px}
.pb{font:inherit;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 6px;cursor:pointer;white-space:nowrap}
.offscreen{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
/* owner dashboard */
.period{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi span{font-size:12px;color:var(--muted)}
.kpi small{display:block;font-size:11.5px;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:620px){.dgrid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.panel h3{font-size:14px;margin:0 0 2px}
.panel .sub{display:block;margin-bottom:10px}
.stack{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{font-family:var(--mono);font-weight:500}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,9em) 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:10px;background:var(--bg);border-start-end-radius:4px;border-end-end-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--accent);border-start-end-radius:4px;border-end-end-radius:4px}
.bar .v{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:2ch;text-align:left}
.bar:hover .fl{filter:brightness(1.15)}
.bars.wide .bar{grid-template-columns:1fr auto;row-gap:2px}
.bars.wide .bar .lb{grid-column:1/-1;white-space:normal}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;height:120px;border-bottom:1px solid var(--line)}

.cols i{display:block;width:60%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.cols div:hover i{filter:brightness(1.15)}
.colx{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px;font-family:var(--mono)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}

.tbl th{font-size:12px;color:var(--muted);font-weight:600}

.tbl th.n2{text-align:center}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--bg)}
.ndel{font:inherit;background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 0;margin-top:4px}
.ba{display:flex;gap:6px;flex-wrap:wrap}
.ba figure{margin:0;text-align:center;font-size:11px;color:var(--muted)}
.ba img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;cursor:zoom-in}
.lib{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:var(--surface)}
.lib-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.libchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:220px;overflow:auto}
.libchip{font:inherit;font-size:13px;text-align:start;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:5px 10px;cursor:pointer}
.libchip::before{content:"+ ";color:var(--accent);font-weight:700}

.libchip:disabled::before{content:"✓ "}
.libchip.mine{border-style:dashed}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.chk{flex-direction:row;align-items:center;gap:6px;font-weight:500;margin-top:6px}
.chk input{width:auto}
.codes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:460px){.codes{grid-template-columns:1fr}}
.codes label{flex-direction:row;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:500;color:var(--ink);cursor:pointer}

.codes label:has(input:checked){outline:2px solid var(--accent);outline-offset:-2px}
.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;padding:4px 12px;font-family:var(--display);font-size:16px;transform:rotate(-3deg)}

.timeline div{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.timeline span:last-child{font-family:var(--mono);color:var(--muted);direction:ltr}
.back{font:inherit;background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;margin-bottom:10px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}

let RX=null;
function buildRx(){const ks=Object.keys(EN).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));RX=new RegExp('(?<![\\u0600-\\u06FF])('+ks.join('|')+')(?![\\u0600-\\u06FF])','g');}
const AR_CODE={'أ':'A','ب':'B','ج':'C','د':'D'};
const EXACT={'م':'#','ي':'d'};
function tr(s){if(LANG!=='en'||!s||!/[؀-ۿ]/.test(s))return s;const k=s.trim();if(EXACT[k])return s.replace(k,EXACT[k]);if(!RX)buildRx();
  return s.replace(RX,m=>EN[m]).replace(/(^|[^؀-ۿ])([أبجد])(?![؀-ۿ])/g,(m,a,b)=>a+AR_CODE[b]).replace(/،/g,',');}
const ORIG=new WeakMap(), ORIGA=new WeakMap();
const ATTRS=['placeholder','title','aria-label','alt'];
function trDom(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode&&(/^(TEXTAREA|SCRIPT|STYLE)$/.test(n.parentNode.nodeName)||(n.parentNode.closest&&n.parentNode.closest('[data-raw]')))?2:1});
  const L=[];let n;while((n=w.nextNode()))L.push(n);
  L.forEach(n=>{const v=n.nodeValue;if(!/[؀-ۿ]/.test(v))return;const t=tr(v);if(t!==v){ORIG.set(n,v);n.nodeValue=t;}});
  (root.querySelectorAll?root.querySelectorAll('['+ATTRS.join('],[')+']'):[]).forEach(e=>ATTRS.forEach(a=>{const v=e.getAttribute(a);if(v&&/[؀-ۿ]/.test(v)){const t=tr(v);if(t!==v){const o=ORIGA.get(e)||{};o[a]=v;ORIGA.set(e,o);e.setAttribute(a,t);}}}));
}
function unDom(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(ORIG.has(n)){n.nodeValue=ORIG.get(n);ORIG.delete(n);}}
  root.querySelectorAll('*').forEach(e=>{const o=ORIGA.get(e);if(o){Object.keys(o).forEach(a=>e.setAttribute(a,o[a]));ORIGA.delete(e);}});
}
function trHTML(h){if(LANG!=='en')return h;const t=document.createElement('template');t.innerHTML=h;trDom(t.content);return t.innerHTML;}
let obsBusy=false;
const obs=new MutationObserver(()=>{if(obsBusy||LANG!=='en')return;obsBusy=true;trDom(document.body);obs.takeRecords();obsBusy=false;});

}

function sketch(kind,sc){sc=sc||1;
  const c=document.createElement('canvas');c.width=640*sc;c.height=420*sc;const g=c.getContext('2d');g.scale(sc,sc);
  g.fillStyle='#f4f6f5';g.fillRect(0,0,640,420);
  g.strokeStyle='#9fb0b3';g.lineWidth=1;
  for(let x=40;x<640;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,420);g.stroke();}
  for(let y=40;y<420;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(640,y);g.stroke();}
  if(kind==='close'){g.strokeStyle='#8a3b12';g.lineWidth=9;
    for(let x=60;x<640;x+=110){g.beginPath();g.moveTo(x,20);g.lineTo(x,400);g.stroke();}
    g.lineWidth=7;for(let y=60;y<420;y+=150){g.beginPath();g.moveTo(20,y);g.lineTo(620,y);g.stroke();}
    g.strokeStyle='#d02828';g.lineWidth=4;g.beginPath();g.arc(390,210,70,0,7);g.stroke();
    g.fillStyle='#18242a';g.font='14px monospace';g.fillText('SAMPLE DETAIL PHOTO',30,400);return c.toDataURL('image/jpeg',0.75);}
  g.strokeStyle='#18242a';g.lineWidth=6;g.strokeRect(80,70,480,280);
  if(kind==='rebar'){g.strokeStyle='#8a3b12';g.lineWidth=3;
    for(let x=110;x<540;x+=28){g.beginPath();g.moveTo(x,85);g.lineTo(x,335);g.stroke();}
    for(let y=100;y<340;y+=28){g.beginPath();g.moveTo(95,y);g.lineTo(545,y);g.stroke();}}
  else if(kind==='col'){g.fillStyle='#6d7f84';[[120,110],[300,110],[480,110],[120,280],[300,280],[480,280]].forEach(p=>g.fillRect(p[0],p[1],40,40));}
  else {g.fillStyle='#c9d4d6';g.fillRect(84,74,472,272);g.fillStyle='#18242a';g.font='bold 22px sans-serif';g.fillText('SLAB +3.80',250,215);}
  g.fillStyle='#18242a';g.font='14px monospace';g.fillText('SAMPLE SITE PHOTO',90,395);
  return c.toDataURL('image/jpeg',sc<1?0.6:0.8);
}

function shrink(file,max){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const sc=Math.min(1,max/Math.max(im.width,im.height));c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72));};im.onerror=()=>res(null);im.src=fr.result;};fr.readAsDataURL(file);});}

function renderLog(){

  const lab={ALL:'كل الطلبات',P:'بانتظار الاستشاري',C:'مطلوب إعادة تقديم',LATE:`متأخر أكثر من ${SLA_DAYS} يوم`};

  if(view.type!=='ALL')rows=rows.filter(r=>r.type===view.type);

  <h2>سجل الطلبات</h2>
  <div class="stats">${Object.keys(cnt).map(k=>`<button class="stat" type="button" data-f="${k}" aria-pressed="${view.filter===k}"><b>${cnt[k]}</b><span>${lab[k]}</span></button>`).join('')}</div>
  <div class="chips">${['ALL','IR','RFI','RR'].map(t=>`<button class="chip" type="button" data-t="${t}" aria-pressed="${view.type===t}">${t==='ALL'?'كل الأنواع':t+' · '+TYPES[t].name}</button>`).join('')}</div>
  <div class="list">${rows.length?rows.map(r=>{const L=last(r);return `
    <button class="row" type="button" data-id="${r.id}">

let dlP=null;
const DL_SHIM={save:async({filename,data})=>{const t=/\.csv$/.test(filename)?'text/csv;charset=utf-8':/\.html$/.test(filename)?'text/html;charset=utf-8':'application/octet-stream';const u=URL.createObjectURL(new Blob([data],{type:t}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return {status:'saved'};}};
function getDownloads(){if(!dlP)dlP=(window.claude&&window.claude.use)?window.claude.use('downloads').then(d=>d||DL_SHIM).catch(()=>DL_SHIM):Promise.resolve(DL_SHIM);return dlP;}

/* ---------- لوحة المالك والتقارير ---------- */
const DAY=864e5;
const days=(a,b)=>(new Date(b)-new Date(a))/DAY;
const CODE_COL={A:'var(--a)',B:'var(--b)',C:'var(--c)',D:'var(--d)',P:'var(--pending)'};
function metrics(since){
  const reqs=S.reqs.filter(r=>!since||new Date(r.revs[0].at)>=since);
  const st=k=>reqs.filter(r=>status(r)===k).length;
  const first=reqs.filter(r=>r.revs[0].code);
  const decided=[];reqs.forEach(r=>r.revs.forEach(x=>{if(x.code&&x.decAt)decided.push(days(x.at,x.decAt));}));
  const byDisc={},byFloor={},noteCnt={};
  reqs.forEach(r=>{const s=status(r);
    (byDisc[r.disc]=byDisc[r.disc]||{n:0,ok:0}).n++; if(s==='A'||s==='B')byDisc[r.disc].ok++;
    const f=(byFloor[r.floor||'—']=byFloor[r.floor||'—']||{n:0,ok:0,open:0,c:0});f.n++;if(s==='A'||s==='B')f.ok++;if(s==='P')f.open++;if(s==='C')f.c++;
    r.revs.forEach(x=>notesOf(x).forEach(n=>{const t=n.t.split(' — ')[0];noteCnt[t]=(noteCnt[t]||0)+1;}));});
  const weeks=[];for(let w=5;w>=0;w--){const end=Date.now()-w*7*DAY,start=end-7*DAY;weeks.push({lab:new Date(start).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'}),n:S.reqs.filter(r=>{const t=+new Date(r.revs[0].at);return t>=start&&t<end;}).length,ok:S.reqs.reduce((a,r)=>a+r.revs.filter(x=>x.code&&(x.code==='A'||x.code==='B')&&+new Date(x.decAt)>=start&&+new Date(x.decAt)<end).length,0)});}
  return {reqs,total:reqs.length,A:st('A'),B:st('B'),C:st('C'),D:st('D'),P:st('P'),late:reqs.filter(late),
    firstRate:first.length?Math.round(first.filter(r=>r.revs[0].code==='A'||r.revs[0].code==='B').length/first.length*100):0,
    avgResp:decided.length?(decided.reduce((a,b)=>a+b,0)/decided.length):0,
    onTime:decided.length?Math.round(decided.filter(x=>x<=SLA_DAYS).length/decided.length*100):0,

function repHTML(pk){

    const doc=`<!doctype html><html dir="${LANG==='en'?'ltr':'rtl'}" lang="${LANG}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${tr('تقرير مصور')} ${PRJ}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap"><style>body{margin:0;background:#ddd}@page{size:A4;margin:8mm}.bar{text-align:center;padding:10px}.bar button{font-size:16px;padding:8px 20px}@media print{.bar{display:none}body{background:#fff}.rep{box-shadow:none!important;padding:0!important}}${document.getElementById('repcss').textContent}</style></head><body><div class="bar"><button onclick="print()">${tr('طباعة')}</button></div>${trHTML(html)}</body></html>`;
    try{await dn.save({filename:`${PRJ}-PHOTO-REPORT-${new Date().toISOString().slice(0,10)}.html`,data:doc});toast('اتنزل التقرير');}catch(e){if(e&&e.code!=='declined')toast('التنزيل مش متاح هنا');}};});
}

/* ---------- أوامر الموقع (SI) وتقارير عدم المطابقة (NCR) ---------- */
const KINDS={SI:{name:'أمر موقع',en:'SITE INSTRUCTION - SI'},NCR:{name:'تقرير عدم مطابقة',en:'NON-CONFORMANCE REPORT - NCR'}};
const IST={ISSUED:{t:'بانتظار استلام المقاول',c:'P'},ACK:{t:'عند المقاول للتنفيذ',c:'C'},DONE:{t:'بانتظار الإقفال',c:'B'},CLOSED:{t:'مقفول',c:'A'}};
const ACT={ACK:'المقاول استلم',DONE:'المقاول نفّذ',CLOSE:'اتقفل',REOPEN:'اترفض التنفيذ — رجع للمقاول'};
const insNum=i=>`${PRJ}-${i.kind}-${pad(i.n)}`;
const today=()=>new Date().toISOString().slice(0,10);
const insLate=i=>i.status!=='CLOSED'&&i.due&&i.due<today();
const insBadge=i=>`<span class="code c-${IST[i.status].c}">${IST[i.status].t}</span>`;
let curIns=null, insDraft=null;

function renderIns(){
  const f=view.insf||(view.insf={s:'ALL',k:'ALL'});
  const all=S.ins||[];
  const cnt={ALL:all.length,OPEN:all.filter(i=>i.status==='ISSUED'||i.status==='ACK').length,DONE:all.filter(i=>i.status==='DONE').length,LATE:all.filter(insLate).length};
  const lab={ALL:'الكل',OPEN:'مفتوح عند المقاول',DONE:'بانتظار الإقفال',LATE:'متأخر عن الموعد'};
  let rows=all.slice().reverse();
  if(f.k!=='ALL')rows=rows.filter(i=>i.kind===f.k);
  if(f.s==='OPEN')rows=rows.filter(i=>i.status==='ISSUED'||i.status==='ACK');
  if(f.s==='DONE')rows=rows.filter(i=>i.status==='DONE');
  if(f.s==='LATE')rows=rows.filter(insLate);
  const canIssue=role==='K'||role==='O';
  app.innerHTML=`
  <div class="toprow"><h2 style="margin:8px 0">أوامر الموقع و NCR</h2>${canIssue?'<button class="btn primary sm" type="button" id="ins-new">+ إصدار أمر موقع / NCR</button>':''}</div>
  <div class="stats">${Object.keys(cnt).map(k=>`<button class="stat" type="button" data-s="${k}" aria-pressed="${f.s===k}"><b>${cnt[k]}</b><span>${lab[k]}</span></button>`).join('')}</div>
  <div class="chips">${['ALL','SI','NCR'].map(k=>`<button class="chip" type="button" data-k="${k}" aria-pressed="${f.k===k}">${k==='ALL'?'كل الأنواع':k+' · '+KINDS[k].name}</button>`).join('')}</div>
  <div class="list">${rows.length?rows.map(i=>`
    <button class="row" type="button" data-ins="${i.id}">
      <span class="type" ${i.kind==='NCR'?'style="background:var(--d-soft);color:var(--d)"':''}>${i.kind}</span>
      <span class="meta"><span class="no">${insNum(i)}</span><span class="subj">${raw(i.subject)}</span>
      <span class="sub">${esc(i.disc)}${i.floor?' · '+esc(i.floor):''} · اتصدر ${fmt(i.at)}${i.due?` · الموعد ${fmt(i.due)}`:''}${insLate(i)?' · <span class="late">متأخر</span>':''}</span></span>
      ${insBadge(i)}
    </button>`).join(''):`<div class="empty">${all.length?'مفيش نتايج بالفلتر ده.':'لسه مفيش أوامر موقع أو تقارير عدم مطابقة.'}</div>`}</div>`;
  const nb=document.getElementById('ins-new');if(nb)nb.onclick=()=>go('issue');
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{f.s=b.dataset.s;renderIns();});
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{f.k=b.dataset.k;renderIns();});
  app.querySelectorAll('[data-ins]').forEach(b=>b.onclick=()=>openIns(b.dataset.ins));
}

function photoPicker(arr,boxId){
  return `<div class="pbtns" style="margin-top:6px"><button type="button" class="pb" data-pp="${boxId}" data-cam="1">📷 تصوير</button><button type="button" class="pb" data-pp="${boxId}">🖼 الصور</button></div>
    <div class="thumbs" id="${boxId}">${arr.map((u,j)=>`<img src="${u}" alt="صورة ${j+1}">`).join('')}</div>`;
}
function bindPicker(arr,boxId){app.querySelectorAll(`[data-pp="${boxId}"]`).forEach(b=>b.onclick=()=>pickPhoto(!!b.dataset.cam,u=>{arr.push(u);const box=document.getElementById(boxId);if(box)box.innerHTML=arr.map((x,j)=>`<img src="${x}" alt="صورة ${j+1}">`).join('');}));}

function renderIssue(){
  if(!(role==='K'||role==='O')){go('ins');return;}
  const files=[];const nextNo=k=>`${PRJ}-${k}-${pad(((S.ins||[]).filter(i=>i.kind===k).reduce((a,i)=>Math.max(a,i.n),0))+1)}`;
  app.innerHTML=`
  <button class="back" type="button" id="bk">→ رجوع للأوامر</button>
  <h2>إصدار أمر موقع / NCR</h2>
  <form class="card" id="isf" novalidate>
    <div class="grid">
      <div class="full"><label>النوع</label><div class="disc">${['SI','NCR'].map((k,i)=>`<label><input type="radio" name="kind" value="${k}" ${i===0?'checked':''}>${KINDS[k].name} (${k})</label>`).join('')}</div></div>
      <label>الرقم<input id="is-no" value="${nextNo('SI')}" readonly style="font-family:var(--mono);direction:ltr;text-align:right"><span class="hint">بيتولد لوحده</span></label>
      <label for="is-due">مطلوب التنفيذ قبل<input id="is-due" type="date" style="direction:ltr"></label>
      <label class="full" for="is-subj">الموضوع<input id="is-subj" placeholder="مثال: تعشيش في عمود C3 بالدور الأرضي"></label>
      <div class="full"><label>نوع الأعمال</label><div class="disc">${DISC.map((x,i)=>`<label><input type="radio" name="idisc" value="${x}" ${i===0?'checked':''}>${x}</label>`).join('')}</div></div>
      <label for="is-area">المنطقة<input id="is-area" placeholder="المبنى الرئيسي"></label>
      <label for="is-floor">الدور<input id="is-floor" placeholder="الدور الأرضي"></label>
      <label class="full" for="is-desc"><span id="is-desc-l">المطلوب تنفيذه</span><textarea id="is-desc" placeholder="اكتب الأمر بالتفصيل"></textarea></label>
      <div class="full"><label>صور / رسومات</label>${photoPicker(files,'is-th')}</div>
    </div>
    <div class="err" id="is-err" role="alert"></div>
    <div class="btns"><button class="btn primary" type="submit">إصدار وإرسال للمقاول</button><button class="btn" type="button" id="cn">إلغاء</button></div>
  </form>`;
  bindPicker(files,'is-th');
  app.querySelectorAll('input[name=kind]').forEach(r=>r.onchange=()=>{const k=r.value;document.getElementById('is-no').value=nextNo(k);
    document.getElementById('is-desc-l').textContent=tr(k==='NCR'?'وصف عدم المطابقة':'المطلوب تنفيذه');});
  document.getElementById('bk').onclick=document.getElementById('cn').onclick=()=>go('ins');
  document.getElementById('isf').onsubmit=async e=>{e.preventDefault();const er=document.getElementById('is-err');er.textContent='';
    const g=id=>document.getElementById(id).value.trim();const kind=(document.querySelector('input[name=kind]:checked')||{}).value||'SI';
    if(!g('is-subj')){er.textContent=tr('اكتب الموضوع الأول');return;}
    busy(true,'جاري الإرسال…');try{
      const paths=[];for(const u of files)paths.push(await upload(u));
      const {data:iid,error}=await sb.rpc('issue_instruction',{p_project:PID,p_kind:kind,p_subject:g('is-subj'),p_discipline:(document.querySelector('input[name=idisc]:checked')||{}).value||'',p_area:g('is-area'),p_floor:g('is-floor'),p_description:g('is-desc'),p_due:g('is-due')||null,p_files:paths});
      if(error)throw error;await loadAll();busy(false);const i=S.ins.find(x=>x.id===iid);toast(`اتصدر ${i?insNum(i):''}`);openIns(iid);
    }catch(err){busy(false);er.textContent=errMsg(err);}};
}

function openIns(id){curIns=(S.ins||[]).find(i=>i.id===id);if(!curIns){go('ins');return;}insDraft=null;view.name='insdetail';renderInsDetail();window.scrollTo(0,0);}
function photosHTML(arr){return arr.length?`<div class="ba" style="margin-top:6px">${arr.map((u,j)=>`<figure><img src="${u}" alt="صورة ${j+1}" data-cap=""></figure>`).join('')}</div>`:'';}
function renderInsDetail(){
  const i=curIns, K=KINDS[i.kind], isNCR=i.kind==='NCR';
  const canAck=role==='C'&&i.status==='ISSUED', canDo=role==='C'&&i.status==='ACK', canClose=role===i.issuerTeam&&i.status==='DONE';
  if((canAck||canDo||canClose)&&!insDraft)insDraft={files:[],body:'',cause:'',corr:''};
  const waiting={ISSUED:'المقاول لسه ما أكدش الاستلام.',ACK:'الأمر عند المقاول للتنفيذ.',DONE:`بانتظار إقفال ${TEAM[i.issuerTeam]}.`,CLOSED:'الأمر اتقفل.'}[i.status];
  app.innerHTML=`
  <div class="toprow"><button class="back" type="button" id="bk">→ رجوع للأوامر</button><button class="btn sm" type="button" id="iprt">🖨 طباعة</button></div>
  <div class="paper">
    <div class="ph"><div><div class="t">${K.name}</div><div class="en">${K.en}</div></div><div>${insBadge(i)}</div></div>
    <div class="kv"><div><small>الرقم</small><strong style="font-family:var(--mono);direction:ltr;display:block;text-align:right">${insNum(i)}</strong></div><div><small>تاريخ الإصدار</small><strong>${fmt(i.at)}</strong></div><div><small>مطلوب قبل</small><strong ${insLate(i)?'class="late"':''}>${i.due?fmt(i.due):'—'}</strong></div></div>
    <div class="kv"><div><small>الموضوع</small><strong>${raw(i.subject)}</strong></div><div><small>نوع الأعمال</small><strong>${esc(i.disc)}</strong></div><div><small>المنطقة / الدور</small><strong>${raw(i.area)}${i.area&&i.floor?' · ':''}${raw(i.floor)}</strong></div></div>
    <div class="sec"><h3>${isNCR?'وصف عدم المطابقة':'المطلوب تنفيذه'} · <span class="hint">${raw(i.by)} — ${TEAM[i.issuerTeam]}</span></h3><div>${esc(i.desc)||'—'}</div>${photosHTML(i.att)}</div>
    ${i.events.length?`<div class="sec"><h3>سير الأمر</h3><ul class="nlist">${i.events.map(e=>`<li class="nitem" style="grid-template-columns:auto 1fr"><span class="n" style="background:${e.action==='REOPEN'?'var(--d)':e.action==='CLOSE'?'var(--a)':'var(--accent)'}">${e.action==='ACK'?'✓':e.action==='DONE'?'⚒':e.action==='CLOSE'?'■':'↺'}</span>
      <div class="txt"><b>${ACT[e.action]}</b> <span class="hint">· ${raw(e.by)} · ${fmt(e.at)}</span>
      ${e.cause?`<div><span class="hint">سبب عدم المطابقة:</span> ${raw(e.cause)}</div>`:''}${e.corrective?`<div><span class="hint">الإجراء التصحيحي:</span> ${raw(e.corrective)}</div>`:''}${e.body?`<div>${raw(e.body)}</div>`:''}${photosHTML(e.files)}</div></li>`).join('')}</ul></div>`:''}
    ${canAck?`<div class="sec"><h3>تأكيد الاستلام</h3><label for="ia-b">ملاحظة (اختياري)<textarea id="ia-b" style="min-height:60px"></textarea></label><div class="btns"><button class="btn primary" type="button" id="ia-go">تأكيد استلام الأمر</button></div></div>`:''}
    ${canDo?`<div class="sec"><h3>${isNCR?'الرد على عدم المطابقة':'تنفيذ الأمر'}</h3>
      ${isNCR?`<label for="id-c">سبب عدم المطابقة<textarea id="id-c" style="min-height:60px">${esc(insDraft.cause)}</textarea></label><label for="id-r" style="margin-top:8px">الإجراء التصحيحي اللي اتعمل<textarea id="id-r" style="min-height:60px">${esc(insDraft.corr)}</textarea></label>`
        :`<label for="id-b">اللي اتنفذ<textarea id="id-b" style="min-height:70px">${esc(insDraft.body)}</textarea></label>`}
      <label style="margin-top:8px">صور بعد التنفيذ</label>${photoPicker(insDraft.files,'id-th')}
      <div class="btns"><button class="btn primary" type="button" id="id-go">تم التنفيذ — إرسال للمراجعة</button></div></div>`:''}
    ${canClose?`<div class="sec"><h3>مراجعة التنفيذ</h3><label for="ic-b">تعليق (مطلوب في حالة الرفض)<textarea id="ic-b" style="min-height:60px"></textarea></label>
      <div class="btns"><button class="btn primary" type="button" id="ic-ok">إقفال الأمر</button><button class="btn" type="button" id="ic-no" style="color:var(--d)">رفض وإعادة للمقاول</button></div></div>`:''}
    ${!(canAck||canDo||canClose)?`<div class="sec" style="border-bottom:0"><p class="hint" style="margin:0">${waiting}</p></div>`:''}
  </div>`;
  document.getElementById('bk').onclick=()=>go('ins');
  document.getElementById('iprt').onclick=()=>renderInsPrint();
  app.querySelectorAll('.ba img').forEach(im=>im.onclick=()=>zoom(im.src));
  const act=async(action,extra,files)=>{busy(true,'جاري الحفظ…');try{
      const paths=[];for(const u of (files||[]))paths.push(await upload(u));
      const {error}=await sb.rpc('instruction_action',Object.assign({p_id:i.id,p_action:action,p_body:null,p_cause:null,p_corrective:null,p_files:paths},extra));if(error)throw error;
      insDraft=null;await loadAll();curIns=S.ins.find(x=>x.id===i.id)||curIns;busy(false);toast(ACT[action]);renderInsDetail();
    }catch(err){busy(false);toast(errMsg(err));}};
  if(canAck)document.getElementById('ia-go').onclick=()=>act('ACK',{p_body:document.getElementById('ia-b').value});
  if(canDo){bindPicker(insDraft.files,'id-th');
    const keep=()=>{if(isNCR){insDraft.cause=document.getElementById('id-c').value;insDraft.corr=document.getElementById('id-r').value;}else insDraft.body=document.getElementById('id-b').value;};
    app.querySelectorAll('#id-c,#id-r,#id-b').forEach(t=>t.oninput=keep);
    document.getElementById('id-go').onclick=()=>{keep();if(!(insDraft.body.trim()||insDraft.corr.trim())){toast(isNCR?'اكتب الإجراء التصحيحي':'اكتب اللي اتنفذ');return;}
      if(!insDraft.files.length&&!confirm(LANG==='en'?'Send without photos?':'تبعت من غير صور؟'))return;
      act('DONE',{p_body:insDraft.body,p_cause:insDraft.cause,p_corrective:insDraft.corr},insDraft.files);};}
  if(canClose){document.getElementById('ic-ok').onclick=()=>act('CLOSE',{p_body:document.getElementById('ic-b').value});
    document.getElementById('ic-no').onclick=()=>{const b=document.getElementById('ic-b').value.trim();if(!b){toast('اكتب سبب الرفض');document.getElementById('ic-b').focus();return;}act('REOPEN',{p_body:b});};}
}

    <td style="width:30%"><b>الرقم:</b><br><span class="mono">${insNum(i)}</span><br><b>التاريخ:</b> <span class="mono">${fmt(i.at)}</span><br><b>مطلوب قبل:</b> <span class="mono">${i.due?fmt(i.due):'—'}</span></td></tr></table>

    <tr><td colspan="4"><div class="sig"><div>أصدره: ${raw(i.by)} (${TEAM[i.issuerTeam]})<div class="s"></div></div><div>التوقيع:<div class="s"></div></div><div>الختم:<div class="s"></div></div></div></td></tr></table>
  <table><tr><th colspan="4">استلام المقاول</th></tr><tr><td colspan="4"><div class="sig"><div>الاسم: ${ack?esc(ack.by):''}<div class="s"></div></div><div>التاريخ: ${ack?`<span class="mono">${fmt(ack.at)}</span>`:''}<div class="s"></div></div><div>التوقيع:<div class="s"></div></div></div></td></tr></table>

      :`<tr><td class="lbl">اللي اتنفذ</td><td>${done&&done.body?esc(done.body):'<div class="line"></div><div class="line"></div>'}</td></tr>`}

  <div class="foot"><span class="mono">${insNum(i)}</span><span>طُبع ${new Date().toLocaleDateString('en-GB')}</span></div></div>`;

function go(n){

  if(n==='new'&&role!=='C')n='log'; if((n==='dash'||n==='photo')&&role!=='O')n='log';
  view.name=n;if(n==='log')(role==='O'?renderALog:renderLog)();else if(n==='new')renderNew();else if(n==='dash')renderDash();else if(n==='photo')renderPhoto();else if(n==='acct')renderAcct();else if(n==='ins')renderIns();else if(n==='issue')renderIssue();else if(n==='notifs')renderNotifs();syncRole();window.scrollTo(0,0);}
function syncRole(){
  const who=document.getElementById('who'),nav=document.querySelector('nav.tabs');
  who.hidden=!ME;nav.hidden=!ME;
  if(ME){who.innerHTML='👤 '+raw(ME.name)+' · <span>'+TEAM[ME.team]+'</span>';who.setAttribute('aria-label',(LANG==='en'?'My account':'حسابي'));}
  setBell();
  document.getElementById('tab-new').hidden=role!=='C';document.getElementById('tab-dash').hidden=role!=='O';document.getElementById('tab-photo').hidden=role!=='O';
  document.getElementById('tab-log').textContent=role==='O'?'اللوج':'الطلبات';
  document.getElementById('tab-dash').textContent='المتابعة';
  document.getElementById('tab-ins').textContent=role==='O'?'الأوامر':'الأوامر و NCR';
  document.getElementById('tab-photo').textContent=role==='O'?'الصور':'التقرير المصور';
  document.querySelector('nav.tabs .wrap').style.gridTemplateColumns=role==='O'?'1fr 1fr 1fr 1fr':role==='C'?'1fr 1fr 1fr':'1fr 1fr';
  const vn=view.name==='detail'||view.name==='print'?'log':view.name==='insdetail'||view.name==='issue'||view.name==='insprint'?'ins':view.name;
  [['tab-dash','dash'],['tab-log','log'],['tab-ins','ins'],['tab-photo','photo']].forEach(([id,v])=>document.getElementById(id).classList.toggle('sel',vn===v));
  if(lastLang!==LANG){lastLang=LANG;}}
let lastLang=LANG;
function rerender(){if(view.name==='detail'||view.name==='print'){view.name='detail';renderDetail();}else if(view.name==='login')renderLogin();else if(view.name==='signup')renderSignup();else if(view.name==='noproj')renderNoProject();else if(view.name==='newpw')renderNewPw();else if(view.name==='join'){}else go(view.name);}

document.getElementById('tab-dash').onclick=()=>go('dash');
document.getElementById('tab-photo').onclick=()=>go('photo');
document.getElementById('tab-ins').onclick=()=>go('ins');
document.getElementById('bell').onclick=()=>go('notifs');
document.getElementById('lang').onclick=()=>{
  LANG=LANG==='en'?'ar':'en';try{localStorage.setItem('site-lang',LANG)}catch(e){}

  if(view.name==='print')renderPrint();else if(view.name==='insdetail')renderInsDetail();else if(view.name==='insprint')renderInsPrint();else rerender();
};
obs.observe(document.body,{childList:true,subtree:true,characterData:true});
let RECOVERY=false;
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){RECOVERY=true;renderNewPw();}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ME)refresh(true);});
(async function start(){
  syncRole();applyLang();app.innerHTML=`<p class="empty">${tr('جاري التحميل…')}</p>`;
  getSW();const qs=new URLSearchParams(location.search);const inv=qs.get('invite');
  if(qs.get('open')){PENDING_OPEN=parseOpen(location.href);history.replaceState(null,'',APP_URL);}
  if(inv){await sb.auth.signOut().catch(()=>{});renderJoin(inv);return;}
  const {data:{session}}=await sb.auth.getSession();
  if(RECOVERY||/type=recovery/.test(location.hash))return;
  if(session)await afterAuth();else renderLogin();
})();
})();
</script>
